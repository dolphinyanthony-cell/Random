<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kickboxing Fighter</title>
<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: Arial;
    }
    canvas {
        display: block;
        margin: auto;
        background: #111;
    }
</style>
</head>
<body>

<canvas id="game" width="900" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Player + Enemy
let player = { x: 100, y: 300, w: 50, h: 80, hp: 100, attacking: false };
let enemy = { x: 700, y: 300, w: 50, h: 80, hp: 100, attacking: false };

// Controls
let keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// Movement
function movePlayer() {
    if (keys["a"]) player.x -= 5;
    if (keys["d"]) player.x += 5;

    // Punch
    if (keys["j"] && !player.attacking) {
        player.attacking = true;
        attack(player, enemy, 10);
        setTimeout(() => player.attacking = false, 200);
    }

    // Kick
    if (keys["k"] && !player.attacking) {
        player.attacking = true;
        attack(player, enemy, 15);
        setTimeout(() => player.attacking = false, 300);
    }
}

// Enemy AI
function moveEnemy() {
    if (enemy.x > player.x) enemy.x -= 2;
    if (enemy.x < player.x) enemy.x += 2;

    if (Math.random() < 0.02 && !enemy.attacking) {
        enemy.attacking = true;
        attack(enemy, player, 10);
        setTimeout(() => enemy.attacking = false, 300);
    }
}

// Attack system
function attack(attacker, target, damage) {
    if (
        attacker.x < target.x + target.w &&
        attacker.x + attacker.w > target.x
    ) {
        target.hp -= damage;
    }
}

// Draw fighters
function drawFighter(f, color) {
    ctx.fillStyle = color;
    ctx.fillRect(f.x, f.y, f.w, f.h);

    if (f.attacking) {
        ctx.fillStyle = "yellow";
        ctx.fillRect(f.x + f.w, f.y + 20, 20, 20);
    }
}

// Health bars
function drawHealth() {
    ctx.fillStyle = "red";
    ctx.fillRect(50, 50, player.hp * 2, 20);

    ctx.fillRect(550, 50, enemy.hp * 2, 20);

    ctx.fillStyle = "white";
    ctx.fillText("PLAYER", 50, 45);
    ctx.fillText("ENEMY", 550, 45);
}

// Game loop
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    movePlayer();
    moveEnemy();

    drawFighter(player, "blue");
    drawFighter(enemy, "red");

    drawHealth();

    // End game
    if (player.hp <= 0) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("YOU LOSE", 350, 250);
        return;
    }

    if (enemy.hp <= 0) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("YOU WIN", 350, 250);
        return;
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
