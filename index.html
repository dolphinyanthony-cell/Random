<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kickboxing Fighters</title>
<style>
body { margin:0; background:black; overflow:hidden; }
canvas { display:block; margin:auto; background:#111; }
</style>
</head>
<body>

<canvas id="game" width="900" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Load images
const playerImg = new Image();
playerImg.src = "fighter1.png";

const enemyImg = new Image();
enemyImg.src = "fighter2.png";

// Fighters
let player = { x:100, y:250, w:80, h:120, hp:100, attacking:false, flip:false };
let enemy  = { x:700, y:250, w:80, h:120, hp:100, attacking:false, flip:true };

// Controls
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// Movement
function movePlayer() {
    if (keys["a"]) player.x -= 5;
    if (keys["d"]) player.x += 5;

    if (keys["j"] && !player.attacking) {
        player.attacking = true;
        attack(player, enemy, 10);
        setTimeout(() => player.attacking = false, 200);
    }

    if (keys["k"] && !player.attacking) {
        player.attacking = true;
        attack(player, enemy, 15);
        setTimeout(() => player.attacking = false, 300);
    }
}

// Enemy AI
function moveEnemy() {
    if (enemy.x > player.x) enemy.x -= 2;
    if (enemy.x < player.x) enemy.x += 2;

    if (Math.random() < 0.02 && !enemy.attacking) {
        enemy.attacking = true;
        attack(enemy, player, 10);
        setTimeout(() => enemy.attacking = false, 300);
    }
}

// Attack
function attack(attacker, target, dmg) {
    if (
        attacker.x < target.x + target.w &&
        attacker.x + attacker.w > target.x
    ) {
        target.hp -= dmg;
    }
}

// Draw fighter with flip + attack animation
function drawFighter(f, img) {
    ctx.save();

    if (f.x < canvas.width / 2) f.flip = false;
    else f.flip = true;

    if (f.flip) {
        ctx.scale(-1, 1);
        ctx.drawImage(img, -f.x - f.w, f.y, f.w, f.h);
    } else {
        ctx.drawImage(img, f.x, f.y, f.w, f.h);
    }

    // Attack effect
    if (f.attacking) {
        ctx.fillStyle = "yellow";
        ctx.fillRect(f.flip ? -f.x - 10 : f.x + f.w, f.y + 40, 20, 20);
    }

    ctx.restore();
}

// Health bars
function drawHealth() {
    ctx.fillStyle = "red";
    ctx.fillRect(50, 40, player.hp * 2, 20);

    ctx.fillRect(550, 40, enemy.hp * 2, 20);

    ctx.fillStyle = "white";
    ctx.fillText("PLAYER", 50, 35);
    ctx.fillText("ENEMY", 550, 35);
}

// Game loop
function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    movePlayer();
    moveEnemy();

    drawFighter(player, playerImg);
    drawFighter(enemy, enemyImg);

    drawHealth();

    if (player.hp <= 0) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("YOU LOSE", 350, 250);
        return;
    }

    if (enemy.hp <= 0) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("YOU WIN", 350, 250);
        return;
    }

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
