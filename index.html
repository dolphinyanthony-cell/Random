<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kickboxing Game</title>
<style>
body { margin:0; background:black; }
canvas { display:block; margin:auto; background:#222; }
</style>
</head>
<body>

<canvas id="game" width="900" height="500"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

// Fighters
let player = { x:150, y:300, hp:100, attacking:false };
let enemy  = { x:650, y:300, hp:100, attacking:false };

// Controls
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// Draw human fighter
function drawFighter(f, color, flip=false) {
    ctx.save();

    if (flip) {
        ctx.translate(f.x + 40, 0);
        ctx.scale(-1,1);
        ctx.translate(-(f.x + 40), 0);
    }

    // Head
    ctx.fillStyle = "#f5c28b";
    ctx.beginPath();
    ctx.arc(f.x + 20, f.y - 40, 15, 0, Math.PI*2);
    ctx.fill();

    // Body
    ctx.fillStyle = color;
    ctx.fillRect(f.x + 10, f.y - 25, 20, 40);

    // Arms
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(f.x + 10, f.y - 10);
    ctx.lineTo(f.x - 10, f.y + (f.attacking ? -20 : 10));
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(f.x + 30, f.y - 10);
    ctx.lineTo(f.x + (f.attacking ? 50 : 40), f.y + (f.attacking ? -20 : 10));
    ctx.stroke();

    // Legs
    ctx.beginPath();
    ctx.moveTo(f.x + 15, f.y + 15);
    ctx.lineTo(f.x, f.y + 40);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(f.x + 25, f.y + 15);
    ctx.lineTo(f.x + 40, f.y + 40);
    ctx.stroke();

    ctx.restore();
}

// Movement
function movePlayer() {
    if (keys["a"]) player.x -= 5;
    if (keys["d"]) player.x += 5;

    if (keys["j"] && !player.attacking) {
        player.attacking = true;
        attack(player, enemy, 10);
        setTimeout(()=>player.attacking=false,200);
    }

    if (keys["k"] && !player.attacking) {
        player.attacking = true;
        attack(player, enemy, 15);
        setTimeout(()=>player.attacking=false,300);
    }
}

// Enemy AI
function moveEnemy() {
    if (enemy.x > player.x) enemy.x -= 2;
    if (enemy.x < player.x) enemy.x += 2;

    if (Math.random() < 0.02 && !enemy.attacking) {
        enemy.attacking = true;
        attack(enemy, player, 10);
        setTimeout(()=>enemy.attacking=false,300);
    }
}

// Attack
function attack(a, b, dmg) {
    if (Math.abs(a.x - b.x) < 60) {
        b.hp -= dmg;
    }
}

// UI
function drawUI() {
    ctx.fillStyle = "red";
    ctx.fillRect(50, 50, player.hp * 2, 20);
    ctx.fillRect(550, 50, enemy.hp * 2, 20);

    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("PLAYER", 50, 45);
    ctx.fillText("ENEMY", 550, 45);
}

// Game loop
function loop() {
    ctx.clearRect(0,0,900,500);

    movePlayer();
    moveEnemy();

    drawFighter(player, "blue", false);
    drawFighter(enemy, "red", true);

    drawUI();

    if (player.hp <= 0) {
        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.fillText("YOU LOSE", 350, 250);
        return;
    }

    if (enemy.hp <= 0) {
        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.fillText("YOU WIN", 350, 250);
        return;
    }

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
