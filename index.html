<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kickboxing Game</title>
<style>
body { margin:0; background:black; color:white; font-family:Arial; }
canvas { display:block; margin:auto; background:#222; }
#resetBtn {
    position:absolute;
    top:10px;
    left:10px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>

<button id="resetBtn">RESET</button>
<canvas id="game" width="900" height="500"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let player, enemy;
let gameOver = false;

// RESET FUNCTION (fixed)
function resetGame() {
    player = { x:150, y:300, hp:100, attacking:false, cooldown:false };
    enemy  = { x:650, y:300, hp:100, attacking:false, cooldown:false };
    gameOver = false;
}

// Button click
document.getElementById("resetBtn").onclick = resetGame;

// Controls
let keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// Draw fighter
function drawFighter(f, color, flip=false) {
    ctx.save();

    if (flip) {
        ctx.translate(f.x + 40, 0);
        ctx.scale(-1,1);
        ctx.translate(-(f.x + 40), 0);
    }

    ctx.fillStyle = "#f5c28b";
    ctx.beginPath();
    ctx.arc(f.x + 20, f.y - 40, 15, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = color;
    ctx.fillRect(f.x + 10, f.y - 25, 20, 40);

    ctx.strokeStyle = color;
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(f.x + 10, f.y - 10);
    ctx.lineTo(f.x - (f.attacking ? 30 : 10), f.y + (f.attacking ? -20 : 10));
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(f.x + 30, f.y - 10);
    ctx.lineTo(f.x + (f.attacking ? 60 : 40), f.y + (f.attacking ? -20 : 10));
    ctx.stroke();

    ctx.restore();
}

// Attack
function attack(a, b, dmg) {
    if (Math.abs(a.x - b.x) < 70) {
        b.hp -= dmg;
    }
}

// Player
function movePlayer() {
    if (keys["a"]) player.x -= 5;
    if (keys["d"]) player.x += 5;

    if (keys["j"] && !player.cooldown) {
        player.attacking = true;
        player.cooldown = true;
        attack(player, enemy, 10);

        setTimeout(()=>player.attacking=false,150);
        setTimeout(()=>player.cooldown=false,300);
    }

    if (keys["k"] && !player.cooldown) {
        player.attacking = true;
        player.cooldown = true;
        attack(player, enemy, 15);

        setTimeout(()=>player.attacking=false,200);
        setTimeout(()=>player.cooldown=false,400);
    }
}

// Enemy
function moveEnemy() {
    if (enemy.x > player.x) enemy.x -= 2;
    if (enemy.x < player.x) enemy.x += 2;

    if (Math.random() < 0.02 && !enemy.cooldown) {
        enemy.attacking = true;
        enemy.cooldown = true;
        attack(enemy, player, 10);

        setTimeout(()=>enemy.attacking=false,200);
        setTimeout(()=>enemy.cooldown=false,500);
    }
}

// UI
function drawUI() {
    ctx.fillStyle = "red";
    ctx.fillRect(50, 50, player.hp * 2, 20);
    ctx.fillRect(550, 50, enemy.hp * 2, 20);

    ctx.fillStyle = "white";
    ctx.fillText("PLAYER", 50, 45);
    ctx.fillText("ENEMY", 550, 45);
}

// LOOP (never stops now)
function loop() {
    ctx.clearRect(0,0,900,500);

    if (!gameOver) {
        movePlayer();
        moveEnemy();
    }

    drawFighter(player, "blue", false);
    drawFighter(enemy, "red", true);
    drawUI();

    if (player.hp <= 0 && !gameOver) {
        gameOver = true;
    }

    if (enemy.hp <= 0 && !gameOver) {
        gameOver = true;
    }

    if (gameOver) {
        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.fillText(
            player.hp <= 0 ? "YOU LOSE" : "YOU WIN",
            320, 250
        );
    }

    requestAnimationFrame(loop);
}

// Start
resetGame();
loop();
</script>

</body>
</html>
