<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kickboxing Game</title>
<style>
body { margin:0; background:black; overflow:hidden; }
canvas { display:block; }
#resetBtn {
    position:absolute;
    top:10px;
    left:10px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
    z-index:10;
}
</style>
</head>
<body>

<button id="resetBtn">RESET</button>
<canvas id="game"></canvas>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

// FULLSCREEN CANVAS
function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// Game state
let player, enemy, gameOver;

function resetGame() {
    player = { x:200, y:c.height - 150, hp:100, punching:false, kicking:false, cooldown:false };
    enemy  = { x:c.width - 250, y:c.height - 150, hp:100, punching:false, kicking:false, cooldown:false };
    gameOver = false;
}
document.getElementById("resetBtn").onclick = resetGame;

// Controls
let keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// Draw fighter
function drawFighter(f, color, flip=false) {
    ctx.save();

    if (flip) {
        ctx.translate(f.x + 40, 0);
        ctx.scale(-1,1);
        ctx.translate(-(f.x + 40), 0);
    }

    // Head
    ctx.fillStyle = "#f5c28b";
    ctx.beginPath();
    ctx.arc(f.x + 20, f.y - 40, 15, 0, Math.PI*2);
    ctx.fill();

    // Body
    ctx.fillStyle = color;
    ctx.fillRect(f.x + 10, f.y - 25, 20, 40);

    ctx.strokeStyle = color;
    ctx.lineWidth = 5;

    // Arms (punch)
    ctx.beginPath();
    ctx.moveTo(f.x + 10, f.y - 10);
    ctx.lineTo(f.x - (f.punching ? 35 : 10), f.y + (f.punching ? -20 : 10));
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(f.x + 30, f.y - 10);
    ctx.lineTo(f.x + (f.punching ? 65 : 40), f.y + (f.punching ? -20 : 10));
    ctx.stroke();

    // Legs (kick)
    ctx.beginPath();
    ctx.moveTo(f.x + 15, f.y + 15);
    ctx.lineTo(f.x + (f.kicking ? -20 : 0), f.y + (f.kicking ? 10 : 40));
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(f.x + 25, f.y + 15);
    ctx.lineTo(f.x + (f.kicking ? 60 : 40), f.y + (f.kicking ? 10 : 40));
    ctx.stroke();

    ctx.restore();
}

// Attack
function attack(a, b, dmg, range) {
    if (Math.abs(a.x - b.x) < range) {
        b.hp -= dmg;
    }
}

// Player
function movePlayer() {
    if (keys["a"]) player.x -= 5;
    if (keys["d"]) player.x += 5;

    if (keys["j"] && !player.cooldown) {
        player.punching = true;
        player.cooldown = true;
        attack(player, enemy, 10, 70);

        setTimeout(()=>player.punching=false,150);
        setTimeout(()=>player.cooldown=false,300);
    }

    if (keys["k"] && !player.cooldown) {
        player.kicking = true;
        player.cooldown = true;
        attack(player, enemy, 18, 90);

        setTimeout(()=>player.kicking=false,200);
        setTimeout(()=>player.cooldown=false,400);
    }
}

// Enemy
function moveEnemy() {
    if (enemy.x > player.x) enemy.x -= 2;
    if (enemy.x < player.x) enemy.x += 2;

    if (Math.random() < 0.02 && !enemy.cooldown) {
        enemy.cooldown = true;

        if (Math.random() < 0.5) {
            enemy.punching = true;
            attack(enemy, player, 10, 70);
            setTimeout(()=>enemy.punching=false,150);
        } else {
            enemy.kicking = true;
            attack(enemy, player, 18, 90);
            setTimeout(()=>enemy.kicking=false,200);
        }

        setTimeout(()=>enemy.cooldown=false,500);
    }
}

// UI
function drawUI() {
    ctx.fillStyle = "red";
    ctx.fillRect(50, 50, player.hp * 3, 20);
    ctx.fillRect(c.width - 350, 50, enemy.hp * 3, 20);

    ctx.fillStyle = "white";
    ctx.fillText("PLAYER", 50, 45);
    ctx.fillText("ENEMY", c.width - 350, 45);

    ctx.fillText("A/D = Move | J = Punch | K = Kick", c.width/2 - 150, c.height - 20);
}

// Loop
function loop() {
    ctx.clearRect(0,0,c.width,c.height);

    if (!gameOver) {
        movePlayer();
        moveEnemy();
    }

    drawFighter(player, "blue", false);
    drawFighter(enemy, "red", true);
    drawUI();

    if (player.hp <= 0 && !gameOver) gameOver = true;
    if (enemy.hp <= 0 && !gameOver) gameOver = true;

    if (gameOver) {
        ctx.fillStyle="white";
        ctx.font="50px Arial";
        ctx.fillText(
            player.hp <= 0 ? "YOU LOSE" : "YOU WIN",
            c.width/2 - 150, c.height/2
        );
    }

    requestAnimationFrame(loop);
}

resetGame();
loop();
</script>

</body>
</html>
